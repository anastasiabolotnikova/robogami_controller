---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: true
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false

# Additional robots to load
robots:
  ground:
    module: env/ground

# General constraints, always on
constraints:
- type: contact
- type: kinematics
  damper: [0.1, 0.01, 0.5]
- type: compoundJoint

# Collision constraint
collisions:
- type: collision
  useMinimal: true

# Initial set of contacts
contacts:
- r2: ground
  r1Surface: Base
  r2Surface: AllGround
- r2: robogami
  r1Surface: Leg2
  r2Surface: TopLeg2
- r2: robogami
  r1Surface: Leg3
  r2Surface: TopLeg3

# Some options for a specific robot
robogami:
  posture:
    stiffness: 1
    weight: 10

# Implement some additional text states
states:

  DefaultPosture:
    base: Posture
    robot: robogami
    postureTask:
      target:
        l1: [0.08726646] # 5 deg
        l2: [0.08726646]
        l3: [0.08726646]

  StretchOut:
    base: Posture
    robot: robogami
    postureTask:
      target:
        l1: [1.4]
        l2: [1.4]
        l3: [1.4]

# Transitions map
transitions:
- [RobogamiController_Initial, OK, DefaultPosture, Strict]
- [DefaultPosture, OK, StretchOut, Strict]
- [StretchOut, OK, DefaultPosture, Strict]

# Initial state
init: RobogamiController_Initial
